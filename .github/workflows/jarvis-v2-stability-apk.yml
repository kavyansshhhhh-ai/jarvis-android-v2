name: Jarvis V2 Stability APK Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v2-apk:
    name: Build, Test, Lint and Upload JARVIS V2 APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Run V2 unit tests, Android Lint, and build Version 2 APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testV2UnitTest :app:lintV2 :app:assembleV2 --no-daemon --stacktrace

      - name: Verify Version 2 APK output
        run: |
          apk="app/build/outputs/apk/v2/JARVIS-V2-STABILITY-2.0.0.apk"
          test -s "$apk"
          size="$(stat -c '%s' "$apk")"
          echo "Version 2 APK: $apk ($size bytes)"
          test "$size" -lt 500000000

      - name: Upload JARVIS V2 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-V2-STABILITY-2.0.0-APK
          path: app/build/outputs/apk/v2/JARVIS-V2-STABILITY-2.0.0.apk
          if-no-files-found: error
          retention-days: 7
